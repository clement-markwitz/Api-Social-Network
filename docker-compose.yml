version: '3.8'

services:

  mongodb:
    image: mongo:6.0
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./donnees_mongo.json:/tmp/donnees.json

  api-rest:
    build: .
    container_name: api_rest_container
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/reseau_culinaire
    depends_on:
      - mongodb

volumes:
  mongo_data: