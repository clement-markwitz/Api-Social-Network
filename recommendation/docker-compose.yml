services:
  flask:
    build: ./
    container_name: flask_app
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
    environment:
      # MongoDB
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      DB_NAME: reseau_culinaire

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4jtest

    volumes:
      - ./:/app
    working_dir: /app
    networks:
      - backend

  mongo:
    image: mongo:latest
    container_name: mongo_db
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - backend
    healthcheck:
      test: |
        mongosh --eval 'try { rs.status().ok } catch (e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }) }'
      interval: 10s
      timeout: 10s
      start_period: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: neo4j_db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4jtest
    volumes:
      - neo4j-data:/data
    networks:
      - backend
    healthcheck:
      # Ajout d'un healthcheck pour se connecter à Neo4j
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p neo4jtest 'RETURN 1;'"]
      interval: 10s
      timeout: 5s
      retries: 5

  watcher:
    image: python:3.9-slim
    container_name: sync_watcher
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi && python -u ./utils/watcher/sync_watcher.py"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=reseau_culinaire
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4jtest
    depends_on:
      - mongo
      - neo4j
      - flask
    restart: on-failure
    tty: true
    networks:
      - backend

volumes:
  mongo-data:
  neo4j-data:
  watcher-data:

networks:
  backend:
